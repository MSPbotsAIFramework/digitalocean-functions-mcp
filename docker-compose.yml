# Local debugging only -- not used in CI or production deployment.
# Credentials are supplied per request via the X-Digitalocean-Token header,
# not via environment variables (see README "Authentication headers").
services:
  digitalocean-functions-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "8080"
